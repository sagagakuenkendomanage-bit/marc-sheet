<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剣道日記 先生用</title>
<style>
  :root{
    --ink:#0d1117; --ink-soft:#3d4451; --ink-muted:#6b7280;
    --bg:#f9f7f4; --bg-warm:#f2efe9; --surface:#ffffff; --surface-2:#faf9f7;
    --border:#e8e2d9; --border-soft:#f0ebe3;
    --primary:#1a3a6b; --primary-lt:#2a5298; --gold:#b8960c; --gold-pale:#fdf6dc; --red:#c0392b;
    --cond:#2a5298; --load:#c8691c; --fill:#1f9e89;
    --shadow-sm:0 1px 4px rgba(13,17,23,.06),0 1px 2px rgba(13,17,23,.04);
    --shadow-md:0 4px 16px rgba(13,17,23,.08),0 2px 6px rgba(13,17,23,.05);
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px; --radius-xl:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 48px;-webkit-font-smoothing:antialiased}
  input{font-family:inherit}
  .wrap{max-width:620px;margin:0 auto}
  .hidden{display:none!important}

  .header{background:var(--surface);border-radius:var(--radius-xl);padding:18px 20px 16px;box-shadow:var(--shadow-md);border:1px solid var(--border-soft);position:relative;overflow:hidden;margin-bottom:12px}
  .header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--gold),var(--primary))}
  .header-en{font-size:9px;letter-spacing:.3em;color:var(--gold);font-weight:700}
  .header-title{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:900;color:var(--ink);letter-spacing:.04em;margin-top:3px}
  .header-title span{color:var(--primary)}
  .header-sub{font-size:11px;color:var(--ink-muted);margin-top:3px}
  /* ===== 専用AI（NotebookLM）リンク ===== */
  .ai-link{display:flex;align-items:center;gap:13px;background:linear-gradient(120deg,#1a3a6b 0%,#2a5298 60%,#34608f 100%);color:#fff;border-radius:var(--radius-lg);padding:14px 18px;margin-top:14px;text-decoration:none;box-shadow:0 4px 18px rgba(26,58,107,0.28),0 0 0 1px rgba(212,173,26,0.35) inset;transition:all .25s ease}
  .ai-link:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 24px rgba(26,58,107,0.35),0 0 0 1px rgba(212,173,26,0.55) inset}
  .ai-link-icon{font-size:24px;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(212,173,26,0.8))}
  .ai-link-body{flex:1}
  .ai-link-title{font-size:15px;font-weight:700;letter-spacing:.04em}
  .ai-link-sub{font-size:11px;color:rgba(255,255,255,0.8);margin-top:2px}
  .ai-link-arrow{font-size:20px;color:rgba(255,255,255,0.75);flex-shrink:0}

  /* 先生の名前（いいね・コメントに使う） */
  .sensei{display:flex;align-items:center;gap:8px;background:var(--bg-warm);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px}
  .sensei-lbl{font-size:11px;font-weight:700;color:var(--ink-muted);white-space:nowrap}
  .sensei input{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:var(--ink)}
  .sensei input:focus{border-color:var(--primary);outline:none}
  .sensei button{flex-shrink:0;min-height:38px;padding:0 14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .sensei-note{font-size:10.5px;color:var(--ink-muted);margin:-8px 2px 12px 2px;padding-left:2px;line-height:1.5}

  /* 気になる部員 */
  .alerts-card{background:linear-gradient(180deg,#fff9e9,#fffdf6);border:1.5px solid var(--gold);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:14px}
  .alerts-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#8a6200;margin-bottom:6px}
  .alerts-cnt{margin-left:auto;font-size:11px;font-weight:700;color:#8a6200;background:#fff;border:1px solid var(--gold);border-radius:999px;padding:2px 9px}
  .alert-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 6px;border-radius:8px;cursor:pointer;transition:background .15s}
  .alert-row:hover{background:#fff6dd}
  .alert-row+.alert-row{border-top:1px solid rgba(184,150,12,.18)}
  .a-name{font-size:14px;font-weight:800;color:var(--primary)}
  .a-tags{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
  .a-tag{font-size:11px;font-weight:700;color:#8a6200;background:#fff;border:1px solid var(--gold);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .alerts-ok{font-size:12px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;text-align:center}
  .sensei-who{display:flex;align-items:center;gap:8px;background:var(--bg-warm);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:7px 12px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--ink)}
  .sensei-who .lbl{font-size:11px;font-weight:700;color:var(--ink-muted)}
  .sensei-who button{margin-left:auto;min-height:32px;padding:0 12px;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer}

  /* ===== 部員の一言（既存の仲間の一言と同じ）===== */
  .hk-wrap{border:1.5px solid rgba(26,58,107,0.18);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
  .hk-head{display:flex;align-items:center;gap:6px;padding:9px 14px;background:rgba(26,58,107,0.06)}
  .hk-head-title{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.04em;white-space:nowrap;flex-shrink:0}
  .hk-head-sub{margin-left:auto;font-size:10px;color:var(--ink-muted);text-align:right}
  .hk-hint{padding:9px 14px 2px;font-size:11px;color:var(--ink-soft);line-height:1.6}
  .hk-hint b{color:var(--primary)}
  .hk-list{padding:2px 14px}
  .hk-item{padding:7px 0 8px;border-bottom:1px solid var(--border-soft)}
  .hk-item:last-child{border-bottom:none}
  .hk-meta{font-size:11px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;min-height:28px}
  .hk-meta-who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hk-date{color:var(--primary);font-weight:700;margin-right:8px}
  .hk-name{font-weight:600;color:var(--ink-soft)}
  .hk-name-link{cursor:pointer;color:var(--primary);font-weight:700}
  .hk-name-link:hover{text-decoration:underline}
  .hk-text{font-size:13px;color:var(--ink);line-height:1.6;margin-top:1px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .hk-text.open{display:block}
  .hk-rx{display:flex;gap:4px;flex-shrink:0}
  .hk-chip{min-height:26px!important;height:26px;padding:0 8px;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .hk-chip::after{content:'';position:absolute;top:-7px;bottom:-7px;left:0;right:0}
  .hk-chip.on{border-color:var(--primary);background:rgba(26,58,107,0.08);color:var(--primary)}
  .hk-chip.hk-count{border:none;background:transparent;padding:0 5px;gap:3px;color:var(--ink-soft)}
  .hk-chip.hk-count.on{background:transparent;color:var(--primary);text-decoration:underline;text-underline-offset:3px}
  .hk-chip.hk-add{width:30px;padding:0;justify-content:center;color:var(--ink-muted);font-size:14px}
  .hk-names{font-size:11px;color:var(--ink-soft);background:var(--bg-warm);border-radius:6px;padding:6px 10px;margin-top:7px;line-height:1.6}
  .hk-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .hk-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .hk-actions .hk-chip{min-height:30px!important;height:30px;padding:0 11px;font-size:12.5px}
  .hk-cm-form{display:flex;gap:6px;margin-top:7px}
  .hk-cm-form input{flex:1;min-width:0;padding:8px 10px!important;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px!important;color:var(--ink)}
  .hk-cm-form input:focus{border-color:var(--primary);outline:none}
  .hk-cm-send{flex-shrink:0;min-height:40px!important;padding:0 14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .hk-cm-count{font-size:10px;color:var(--ink-muted);text-align:right;margin-top:3px}
  .hk-empty{font-size:12px;color:var(--ink-muted);padding:16px 0;text-align:center}

  /* ===== グラフ詳細 ===== */
  .back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--primary);cursor:pointer;margin-bottom:12px}
  .back:hover{background:var(--bg-warm)}
  .detail{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-soft);box-shadow:var(--shadow-sm);padding:18px 20px}
  .d-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .d-name{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:900;color:var(--primary)}
  .period{display:flex;gap:4px;background:rgba(26,58,107,.08);border-radius:999px;padding:4px;margin-left:auto}
  .period button{min-height:34px;padding:0 14px;border:none;border-radius:999px;background:transparent;color:var(--primary);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .period button.on{background:var(--primary);color:#fff}
  .card-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
  .card-h .ic{font-size:16px}
  .card-h .t{font-size:14px;font-weight:700;color:var(--primary)}
  .wave-box{background:var(--surface-2);border-radius:12px;padding:10px 8px 6px}
  svg.wave{width:100%;height:auto;display:block}
  .wave .grid-l{stroke:rgba(26,58,107,.10);stroke-width:1}
  .wave .mid{stroke:rgba(26,58,107,.20)}
  .wave .ax{font-size:10px;fill:var(--ink-muted)}
  .wave .date{font-size:9.5px;fill:var(--ink-muted)}
  .wave .l-cond{stroke:var(--cond);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .wave .l-load{stroke:var(--load);stroke-width:2;fill:none;stroke-dasharray:5 3;stroke-linejoin:round;stroke-linecap:round}
  .wave .l-fill{stroke:var(--fill);stroke-width:2;fill:none;stroke-dasharray:1.5 3;stroke-linecap:round;stroke-linejoin:round}
  .wave circle{stroke:#fff;stroke-width:1}
  .pt-cond{fill:var(--cond)} .pt-load{fill:var(--load)} .pt-fill{fill:var(--fill)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:8px;padding-left:4px}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .legend .s-cond{background:var(--cond)}
  .legend .s-load{background:repeating-linear-gradient(90deg,var(--load) 0 5px,transparent 5px 8px)}
  .legend .s-fill{background:repeating-linear-gradient(90deg,var(--fill) 0 2px,transparent 2px 5px)}
  .theme{display:flex;flex-direction:column;background:var(--surface-2);border-left:4px solid var(--primary);border-radius:0 12px 12px 0;padding:10px 14px;margin:16px 0}
  .theme-name{font-size:17px;font-weight:800;color:var(--primary);line-height:1.35}
  .theme-sub{font-size:11px;color:var(--ink-muted);margin-top:2px}
  .empty{font-size:12.5px;color:var(--ink-muted);background:var(--surface-2);border-radius:10px;padding:14px;text-align:center}
  .hk2{background:var(--surface-2);border-radius:10px;padding:9px 12px;margin-bottom:7px}
  .hk2-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .hk2-date{font-size:11px;font-weight:700;color:var(--gold)}
  .hk2-nums{font-size:10px;color:var(--ink-muted);margin-left:auto}
  .hk2-nums b{color:var(--ink-soft)}
  .hk2-text{font-size:13px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .d-spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:24px auto;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-md);transition:transform .3s;z-index:999;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* ===== 詳細分析（公開版より移植）===== */
  .da-card { margin-top: 0; padding: 14px 16px; border-radius: var(--radius-md); background: #F4F7FC; border: 1px solid rgba(26,58,107,0.15); color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
  .da-head { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--primary); font-size: 14px; margin-bottom: 4px; }
  .da-head button { margin-left: auto; min-height: 30px !important; padding: 0 10px; border: 1px solid rgba(26,58,107,0.3); border-radius: 999px; background: var(--surface); color: var(--primary); font-family: inherit; font-size: 12px; cursor: pointer; }
  .da-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 8px; }
  .da-sec { margin-top: 10px; }
  .da-sec-title { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
  .da-avg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .da-avg div { background: var(--surface); border-radius: 10px; padding: 6px 4px; text-align: center; font-size: 11px; }
  .da-avg b { display: block; font-size: 18px; color: var(--primary); line-height: 1.3; }
  .da-avg small { display: block; font-size: 11px; color: var(--ink-muted); }
  .da-row { background: var(--surface); border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; }
  .da-row b { color: var(--ink-soft); }
  .da-note { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .da-empty { background: var(--surface); border-radius: 12px; padding: 12px; margin-top: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
  .da-empty-s { font-size: 11.5px; font-weight: 400; color: var(--ink-muted); margin-top: 2px; }
  .da-empty-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .da-empty-btns button { min-height: 36px !important; padding: 0 12px; border: 1.5px solid var(--primary); border-radius: 999px; background: var(--surface); color: var(--primary); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .da-bar-block { background: var(--surface); border-radius: 10px; padding: 8px 10px 6px; margin-bottom: 6px; }
  .da-bar-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 12px; }
  .da-bar-head b { color: var(--ink-soft); font-size: 13px; }
  .da-bar-avg { color: var(--primary); font-weight: 700; }
  .da-bar-trend { color: var(--ink-muted); font-size: 11px; }
  .da-bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 4px; }
  .da-bar-col { display: flex; flex-direction: column; align-items: center; }
  .da-bar-n { font-size: 10.5px; color: var(--ink-soft); height: 15px; line-height: 15px; }
  .da-bar-track { width: 100%; max-width: 34px; height: 56px; display: flex; align-items: flex-end; border-bottom: 1px solid rgba(26,58,107,0.25); }
  .da-bar { width: 100%; background: var(--primary); border-radius: 4px 4px 0 0; }
  .da-bar-x { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .da-bar-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-muted); margin-top: 1px; }
  .da-tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border-radius: 10px; overflow: hidden; font-size: 12px; }
  .da-tbl th, .da-tbl td { padding: 6px 8px; text-align: center; border-bottom: 1px solid rgba(26,58,107,0.08); }
  .da-tbl thead th { font-size: 11px; color: var(--ink-muted); font-weight: 500; white-space: nowrap; padding: 6px 4px; }
  .da-tbl tbody th { text-align: left; font-weight: 700; color: var(--ink-soft); }
  .da-tbl td { font-weight: 700; color: var(--primary); font-size: 14px; }
  .da-tbl tr:last-child th, .da-tbl tr:last-child td { border-bottom: none; }
  .da-q5 { display: grid; grid-template-columns: 1fr; gap: 4px; }
  .da-q5 div { display: flex; justify-content: space-between; gap: 6px; background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 12px; }
  .da-q5 b { color: var(--primary); white-space: nowrap; }
  .da-rx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .da-rx div { background: var(--surface); border-radius: 10px; padding: 6px 4px; text-align: center; }
  .da-rx-icon { font-size: 16px; }
  .da-rx b { display: block; font-size: 18px; color: var(--primary); line-height: 1.2; }
  .da-rx small { display: block; font-size: 11px; color: var(--ink-muted); }
  .da-sub-title { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 8px 0 4px; }
  .da-cm { background: var(--surface); border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; }
  .da-cm-text { color: var(--ink-soft); }
  .da-cm-meta { font-size: 11px; color: var(--ink-muted); }
  .da-hbars { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border-radius: 10px; padding: 10px; }
  .da-hbar-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
  .da-hbar-label b { color: var(--primary); white-space: nowrap; }
  .da-hbar-track { flex: 1; height: 12px; background: rgba(26,58,107,0.06); border-radius: 0 4px 4px 0; overflow: hidden; }
  .da-hbar { height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; }
  .da-hbar.lo { background: #9fb3d6; }
  .da-hbar-detail { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; }
  .da-stack { display: flex; gap: 2px; height: 100%; }
  .da-seg { height: 100%; min-width: 3px; }
  .da-seg:last-child { border-radius: 0 4px 4px 0; }
  .o-good { background: #2a5298; } .o-some { background: #6f9be0; } .o-bad { background: #d9822b; } .o-other { background: #98a3b6; }
  .da-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .da-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .da-tl { background: var(--surface); border-radius: 10px; padding: 10px; }
  .da-tl-row { margin-bottom: 8px; }
  .da-tl-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
  .da-tl-head b { color: var(--primary); white-space: nowrap; }
  .da-tl-cells { display: grid; gap: 2px; }
  .da-tl-cells i { display: block; height: 14px; border-radius: 3px; background: rgba(26,58,107,0.08); }
  .da-tl-cells i.on { background: var(--primary); }
  .da-tl-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-muted); }
  .da-gbar-block { background: var(--surface); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .da-gbar-name { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .da-gbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .da-gbar-lab { width: 3.6em; font-size: 11px; color: var(--ink-muted); white-space: nowrap; }
  .da-gbar b { width: 2em; text-align: right; font-size: 13px; color: var(--primary); }
  .da-goal { background: var(--surface); border-left: 4px solid var(--primary); border-radius: 0 10px 10px 0; padding: 8px 12px; margin: 14px 0 0; }
  .da-goal-k { font-size: 11px; font-weight: 700; color: var(--ink-muted); }
  .da-goal-t { font-size: 15px; font-weight: 700; color: var(--primary); line-height: 1.5; }
  .da-goal-s { font-size: 10.5px; color: var(--ink-muted); }
  .da-fc { background: var(--surface); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .da-fc-name { color: var(--ink-soft); font-size: 13px; }

<script>
// ===== 設定（北高：既存デプロイURL）=====
const GAS_URL     = 'https://script.google.com/macros/s/AKfycbzAEjob4wNJKirt1L3HG97ujk7oLEC8dCLm3zBRXana_ci-0TbiUwTunLckWTwTMd-2/exec';
const WRITE_TOKEN = 'marc2025SagaKendo';
const LS_SENSEI   = 'marc_sensei_name';

function $(id){ return document.getElementById(id); }
function escH(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function lsGet(k){ try{return localStorage.getItem(k)||'';}catch(e){return '';} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
var _toastT;
function showToast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(function(){t.classList.remove('show');},2600); }

// ===== JSONP（GASを確実に読む）=====
function jsonp(url){
  return new Promise(function(resolve, reject){
    var cb='__s_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    var s=document.createElement('script');
    var timer=setTimeout(function(){cleanup();reject(new Error('timeout'));},15000);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=function(d){cleanup();resolve(d);};
    s.onerror=function(){cleanup();reject(new Error('script error'));};
    s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}

// ===== 先生の名前 =====
function senseiName(){ return String(lsGet(LS_SENSEI)||'').replace(/[　\s]+/g,''); }
function hkMe(){ return senseiName(); }
function refreshSensei(){
  var n=senseiName();
  if(n){ $('sensei-input').classList.add('hidden'); $('sensei-who').classList.remove('hidden'); $('sensei-who-name').textContent=n; }
  else { $('sensei-input').classList.remove('hidden'); $('sensei-who').classList.add('hidden'); }
}
function confirmSensei(){ var v=($('sensei-name').value||'').trim().replace(/[　\s]+/g,''); if(!v){ $('sensei-name').focus(); return; } lsSet(LS_SENSEI,v); refreshSensei(); drawHitokoto(); }
function editSensei(){ $('sensei-input').classList.remove('hidden'); $('sensei-who').classList.add('hidden'); $('sensei-name').value=senseiName(); $('sensei-name').focus(); }
function needName(){ showToast('⚠ 先に先生のお名前を入れてください'); editSensei(); window.scrollTo(0,0); }

// ===== 部員の一言（既存の仲間の一言を流用）=====
const HK_TYPES=[{k:'nice',icon:'👍',label:'ナイス'},{k:'wakaru',icon:'🤝',label:'わかる'},{k:'sanko',icon:'💡',label:'いい気づき'}];
const HK_CM_MAX=30;
let hkItems=[], hkOpenNames=null, hkOpenPicker=null, hkCommentFor=null, hkDisplayNames={};
function hkDn(n){ return hkDisplayNames[n]||n; }

function loadFeed(){
  // 部員版で毎日動いている方式（plain fetch）に合わせる
  fetch(GAS_URL+'?action=getNews&lite=1',{method:'GET'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      hkDisplayNames=(data&&data.displayNames)||{};
      hkItems=(data&&Array.isArray(data.hitokoto))?data.hitokoto:[];
      hkOpenNames=null; hkOpenPicker=null; hkCommentFor=null;
      drawHitokoto();
    })
    .catch(function(){ $('hk-list').innerHTML='<div class="hk-empty">読み込みに失敗しました。再読み込みしてください。</div>'; });
}

function drawHitokoto(){
  const list=$('hk-list'); if(!list) return;
  const me=hkMe();
  if(!hkItems.length){ list.innerHTML='<div class="hk-empty">まだ部員の一言はありません</div>'; return; }
  list.innerHTML=hkItems.map(function(it,i){
    const rx=it.reactions||{};
    // ＋なし：いいね3種＋コメントを最初から表示。いいね＝1タップ、コメント＝1タップで入力欄。
    let actions='';
    if(it.id){
      actions='<div class="hk-actions">'+HK_TYPES.map(function(t){
        const cnt=(rx[t.k]||[]).length;
        const on=!!me && (rx[t.k]||[]).indexOf(me)>=0;
        return '<button class="hk-chip'+(on?' on':'')+'" onclick="hkReact('+i+',\''+t.k+'\')">'+t.icon+' '+t.label+(cnt?' '+cnt:'')+'</button>';
      }).join('')
      +'<button class="hk-chip'+(hkCommentFor===i?' on':'')+'" onclick="hkOpenComment('+i+')">💬 コメント</button></div>';
      if(hkCommentFor===i){
        actions+='<div class="hk-cm-form">'
          +'<input type="text" id="hk-cm-input" maxlength="'+HK_CM_MAX+'" placeholder="'+escH(hkDn(it.name)).replace(/"/g,'&quot;')+'さんにだけ届きます（'+HK_CM_MAX+'字まで）" oninput="hkCmCount(this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();hkSendComment('+i+');}">'
          +'<button class="hk-cm-send" onclick="hkSendComment('+i+')">送る</button>'
          +'</div><div class="hk-cm-count" id="hk-cm-count">0 / '+HK_CM_MAX+'</div>';
      }
    }
    return '<div class="hk-item">'
      +'<div class="hk-meta"><span class="hk-meta-who"><span class="hk-date">'+escH(it.date)+'</span><span class="hk-name hk-name-link" onclick="openGraph('+i+')">'+escH(hkDn(it.name))+' ▸</span></span></div>'
      +'<div class="hk-text" onclick="this.classList.toggle(\'open\')">'+escH(it.text)+'</div>'
      +actions+'</div>';
  }).join('');
}

function hkToggleNames(i,k){ hkOpenPicker=null; hkOpenNames=(hkOpenNames&&hkOpenNames.i===i&&hkOpenNames.k===k)?null:{i:i,k:k}; drawHitokoto(); }
function hkTogglePicker(i){ hkOpenNames=null; hkOpenPicker=(hkOpenPicker===i)?null:i; hkCommentFor=null; drawHitokoto(); }
function hkOpenComment(i){ if(!hkMe()){ needName(); return; } hkCommentFor=(hkCommentFor===i)?null:i; drawHitokoto(); var el=$('hk-cm-input'); if(el) el.focus(); }
function hkCmCount(el){ var c=$('hk-cm-count'); if(c) c.textContent=el.value.length+' / '+HK_CM_MAX; }

function hkSendComment(i){
  const it=hkItems[i]; const el=$('hk-cm-input'); const me=hkMe();
  if(!it||!it.id||!el) return;
  const text=el.value.replace(/[\r\n]+/g,' ').trim();
  if(!text){ showToast('⚠ コメントを入力してください'); el.focus(); return; }
  if(text.length>HK_CM_MAX){ showToast('⚠ '+HK_CM_MAX+'字以内にしてください'); return; }
  if(!me){ needName(); return; }
  if(me===it.name){ return; }
  fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({_token:WRITE_TOKEN,action:'addComment',targetId:it.id,text:text,commenter:me})})
    .then(function(){ showToast('✓ '+hkDn(it.name)+'さんにだけ届けました'); })
    .catch(function(){ showToast('⚠ 通信に失敗しました。もう一度送ってください'); });
  hkCommentFor=null; hkOpenPicker=null; drawHitokoto();
}

function hkReact(i,k){
  const it=hkItems[i]; if(!it||!it.id) return;
  const me=hkMe();
  if(!me){ needName(); return; }
  if(me===it.name) return;
  it.reactions=it.reactions||{};
  const arr=it.reactions[k]=it.reactions[k]||[];
  const j=arr.indexOf(me);
  if(j>=0) arr.splice(j,1); else arr.push(me);
  hkOpenPicker=null; hkOpenNames=arr.length?{i:i,k:k}:null;
  drawHitokoto();
  fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({_token:WRITE_TOKEN,action:'toggleReaction',targetId:it.id,type:k,reactor:me})})
    .catch(function(){ showToast('⚠ 通信に失敗しました。もう一度押してください'); });
}

// ===== 気になる部員 =====
let alertsData=[];
function loadAlerts(){
  fetch(GAS_URL+'?action=teacherAlerts',{method:'GET'})
    .then(function(r){ return r.json(); })
    .then(function(d){ if(!d||d.status!=='ok'){ $('alerts').innerHTML=''; return; } renderAlerts(d.alerts||[]); })
    .catch(function(){ $('alerts').innerHTML=''; });
}
function renderAlerts(list){
  alertsData=list||[];
  var box=$('alerts');
  if(!alertsData.length){ box.innerHTML='<div class="alerts-ok">👍 いまは特に気になる部員はいません</div>'; return; }
  box.innerHTML='<div class="alerts-card"><div class="alerts-h">⚠ 気になる部員<span class="alerts-cnt">'+alertsData.length+'名</span></div>'
    +alertsData.map(function(a,i){
      var tags=(a.reasons||[]).map(function(t){ return '<span class="a-tag">'+escH(t)+'</span>'; }).join('');
      return '<div class="alert-row" onclick="openAlert('+i+')"><span class="a-name">'+escH(a.display||a.name)+' ▸</span><span class="a-tags">'+tags+'</span></div>';
    }).join('')+'</div>';
}
function openAlert(i){ var a=alertsData[i]; if(a) openGraphByName(a.name, a.display); }

// ===== グラフ詳細（詳細分析）=====
let curName='', curRange=31;
const RANGE_LABEL={7:'1週間',31:'1か月',93:'3か月'};
function openGraphByName(name, display){
  curName=name; curRange=31;
  $('d-name').textContent=display||name;
  Array.prototype.forEach.call($('period').children,function(b){ b.classList.toggle('on', b.getAttribute('data-range')==='31'); });
  $('view-feed').classList.add('hidden'); $('view-detail').classList.remove('hidden');
  window.scrollTo(0,0);
  loadAnalyze();
}
function openGraph(i){ const it=hkItems[i]; if(!it) return; openGraphByName(it.name, hkDn(it.name)); }
function toFeed(){ $('view-detail').classList.add('hidden'); $('view-feed').classList.remove('hidden'); window.scrollTo(0,0); loadFeed(); loadAlerts(); }
function setPeriod(range,btn){ curRange=range; Array.prototype.forEach.call($('period').children,function(b){ b.classList.remove('on'); }); btn.classList.add('on'); loadAnalyze(); }
let daReq2=0;
function loadAnalyze(){
  var req=++daReq2;
  $('d-body').innerHTML='<div class="da-card"><div class="d-spin"></div></div>';
  fetch(GAS_URL+'?action=teacherAnalyze&name='+encodeURIComponent(curName)+'&rangeDays='+curRange+'&_='+Date.now(),{method:'GET'})
    .then(function(r){ return r.text(); })
    .then(function(t){ if(req!==daReq2) return; var j=JSON.parse(t); if(j.status!=='ok') throw 0; $('d-body').innerHTML='<div class="da-card">'+teacherRender(j)+'</div>'; })
    .catch(function(){ if(req!==daReq2) return; $('d-body').innerHTML='<div class="da-card"><div class="da-meta">分析を読み込めませんでした。もう一度お試しください。</div></div>'; });
}
function teacherRender(d){
  var rt = d.rangeFrom ? ('直近'+RANGE_LABEL[d.rangeDays]+'（'+daEsc(d.rangeFrom)+'〜'+daEsc(d.rangeTo)+'）') : ('直近'+(RANGE_LABEL[d.rangeDays]||''));
  if(!d.days){ return '<div class="da-meta">'+rt+'</div><div class="da-empty"><div>この期間の記録はありません。</div></div>' + daNotes(d) + daPeers(d); }
  var h='<div class="da-meta">'+rt+'・記録 <b>'+d.days+'回</b></div>';
  if(d.days < d.minDays){ return h + daWave(d) + '<div class="da-meta">この期間の記録が'+d.minDays+'回たまると、テーマの分析も表示します。</div>' + daNotes(d) + daPeers(d); }
  return h + daWave(d) + daFocus(d) + daHalves(d) + daNotes(d) + daPeers(d);
}
function daHalves(d){
  if(!d.focus||!d.focus.length) return '';
  var rows=d.focus.filter(function(f){return f.halves;});
  if(!rows.length) return '';
  var pct=function(t){ return t.n? Math.round((t.good+t.some)/t.n*100):0; };
  return '<div class="da-sec"><div class="da-sec-title">前半 → 後半（うまくいった割合）</div>'+rows.map(function(f){
    var a=pct(f.halves.first), b=pct(f.halves.second);
    var col=b>a?'#15803d':(b<a?'#c0392b':'var(--primary)'), arr=b>a?' ↗ 伸びている':(b<a?' ↘ 下がり気味':' → 横ばい');
    return '<div class="da-row"><b>'+daEsc(daLabel(f.label))+'</b>　'+a+'% → <b style="color:'+col+'">'+b+'%</b>'+arr+'</div>';
  }).join('')+'</div>';
}

function daEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; });
}
function daLabel(s) { return String(s || '').replace(/^(マイ|その他):/, ''); } // マイテーマは名前だけ出す
function daNum(v) { return (v == null) ? '—' : Number(v).toFixed(1); }

// 仲間からの反応
function daPeers(d) {
  const p = d.peers;
  if (!p) return '';
  const rx = p.reactions || {};
  const types = (typeof HK_TYPES !== 'undefined') ? HK_TYPES : [ { k: 'nice', icon: '👍', label: 'ナイス' }, { k: 'wakaru', icon: '🤝', label: 'わかる' }, { k: 'sanko', icon: '💡', label: '参考になる' } ];
  const totalRx = types.reduce(function(a, t) { return a + (rx[t.k] || 0); }, 0);
  let h = '<div class="da-sec"><div class="da-sec-title">' + (d.notes === undefined ? '③' : '④') + ' 仲間からの反応</div>';
  if (!totalRx && !p.commentTotal) return h + '<div class="da-row">この範囲の反応はまだありません。</div></div>';
  h += '<div class="da-rx">' + types.map(function(t) {
    return '<div><span class="da-rx-icon">' + t.icon + '</span><b>' + (rx[t.k] || 0) + '</b><small>' + t.label + '</small></div>';
  }).join('') + '</div>';
  if (p.reactors && p.reactors.length) {
    h += '<div class="da-sub-title">反応をくれた仲間</div>' + daHBars(p.reactors.map(function(r) { return { label: r.name, value: r.count }; }), '回');
  }
  if (p.commentTotal) {
    h += '<div class="da-sub-title">💬 コメント ' + p.commentTotal + '件</div>';
    h += '<div class="da-row" style="font-size:11.5px;color:var(--ink-muted);">コメントの本文は、部員（本人）だけが見られます。先生の画面には表示しません。</div>';
  }
  return h + '</div>';
}

// 横棒グラフ（1系列）：items = [{label, value}]
function daHBars(items, unit) {
  const max = Math.max.apply(null, items.map(function(x) { return x.value; }).concat([1]));
  return '<div class="da-hbars">' + items.map(function(x) {
    const pct = x.value ? Math.max(3, Math.round(x.value / max * 100)) : 0;
    return '<div class="da-hbar-row"><div class="da-hbar-label"><span>' + daEsc(x.label) + '</span><b>' + x.value + (unit || '') + '</b></div>'
      + '<div class="da-hbar-track"><div class="da-hbar" style="width:' + pct + '%"></div></div></div>';
  }).join('') + '</div>';
}

// Q5 の結果（1日を1つに決めたもの）の色
const DA_OUTCOMES = [
  { k: 'good',  label: 'うまくできた',       short: 'うまく',   cls: 'o-good' },
  { k: 'some',  label: '少しうまくできた',   short: '少し',     cls: 'o-some' },
  { k: 'bad',   label: 'うまくできなかった', short: 'できず',   cls: 'o-bad' },
  { k: 'other', label: 'それ以外',           short: 'それ以外', cls: 'o-other' }
];
function daOutcomeCls(k) { const o = DA_OUTCOMES.find(function(x) { return x.k === k; }); return o ? o.cls : ''; }

// 今のテーマ：この期間に剣道日記のQ4でいちばん多く選んだ項目（同じ日数なら最近選んだ方）
function daGoal(d) {
  if (!d.focus || !d.focus.length) return '';
  return '<div class="da-goal"><div class="da-goal-k">🎯 今のテーマ</div><div class="da-goal-t">' + daEsc(daLabel(d.focus[0].label)) + '</div>'
    + '<div class="da-goal-s">この期間にQ4でいちばん多く選んだ項目（' + d.focus[0].count + '日）</div></div>';
}

// ② 今のテーマの進み具合：そのテーマを選んだ日だけを古い順に、Q5の結果ごとの段に点で並べる
//   段（上から）：うまくできた／少しうまくできた／うまくできなかった／それ以外。色ではなく「高さ」で結果を表す
const DA_LANES = [
  { k: 'good',  label: 'うまく' },
  { k: 'some',  label: '少し' },
  { k: 'bad',   label: 'できず' },
  { k: 'other', label: 'その他' }
];
let daSeqData = null;
// 意識したテーマ：テーマごとに1行。選んだ日を1マスずつ、その日のQ5の結果で色分けして日付順に並べる（ユニットチャート）
// 小さい回数は割合ではなく「回数そのもの」を見せる。色だけに頼らず、マスの中に ◎○× の記号も入れる
const DA_TAG_RES = {
  good:  { label: 'うまくできた', mark: '◎' },
  some:  { label: '少しうまくできた',   mark: '○' },
  bad:   { label: 'うまくできなかった', mark: '×' },
  other: { label: '試した・気づいた・変化なし', mark: '' } // Q5で上の3つ以外だけを選んだ日（新しいことを試した／気づいたことがあった／特に変化なし）
};
let daTagData = [];
function daFocus(d) {
  if (!d.focus || !d.focus.length) return '';
  daTagData = d.focus;
  const top = d.focus[0];
  let h = '<div class="da-sec"><div class="da-sec-title">② 意識したテーマ</div>'
    + '<div class="da-tag-lead">いちばん意識したのは「<b>' + daEsc(daLabel(top.label)) + '</b>」（記録' + d.days + '回のうち' + top.count + '回）</div>'
    + '<div class="da-tag-key">' + ['good', 'some', 'bad', 'other'].map(function(k) {
        return '<span><i class="da-sq r-' + k + '">' + DA_TAG_RES[k].mark + '</i>' + DA_TAG_RES[k].label + '</span>';
      }).join('') + '</div><div class="da-tags">';
  d.focus.forEach(function(f, ri) {
    const seq = f.seq || [];
    const cnt = { good: 0, some: 0, bad: 0, other: 0 };
    seq.forEach(function(c) { cnt[c.c] = (cnt[c.c] || 0) + 1; });
    const mine = /^マイ:/.test(f.label);
    h += '<div class="da-tag-row">'
      + '<div class="da-tag-head"><span class="da-tag' + (mine ? ' mine' : '') + '">' + (mine ? '★ ' : '') + daEsc(daLabel(f.label)) + '</span>'
      + '<span class="da-tag-n">' + f.count + '回</span>'
      + (f.run >= 2 ? '<span class="da-tag-run">最新まで' + f.run + '回続けて</span>' : '') + '</div>'
      + '<div class="da-tag-cells' + (seq.length > 14 ? ' dense' : '') + '">' + seq.map(function(c, i) {
          const res = DA_TAG_RES[c.c] || DA_TAG_RES.other;
          return '<button type="button" class="da-sq r-' + c.c + '" aria-label="' + daEsc(c.d) + ' ' + res.label + '" onclick="daTagShow(' + ri + ',' + i + ')">' + res.mark + '</button>';
        }).join('') + '</div>'
      + '<div class="da-tag-sum">' + ['good', 'some', 'bad'].filter(function(k) { return cnt[k]; }).map(function(k) {
          return DA_TAG_RES[k].mark + ' ' + DA_TAG_RES[k].label + ' ' + cnt[k];
        }).join('　') + (cnt.other ? '　□ ' + DA_TAG_RES.other.label + ' ' + cnt.other : '') + '</div>'
      + '<div class="da-tag-info" id="da-tag-info-' + ri + '"></div>'
      + '</div>';
  });
  return h + '</div><div class="da-note">マスは選んだ日を古い順に並べたものです。押すとその日の結果が出ます</div></div>';
}
function daTagShow(ri, i) {
  const f = daTagData[ri], c = f && (f.seq || [])[i];
  const el = document.getElementById('da-tag-info-' + ri);
  if (!c || !el) return;
  el.textContent = c.d + '：' + (DA_TAG_RES[c.c] || DA_TAG_RES.other).label + (c.m ? '（ほかのテーマも選んだ日）' : '');
}

// ① 調子の波：記録した日ごとの充実度・コンディション・負荷（1〜5）。記録した日だけを詰めて並べる
let daWaveData = null;
function daWave(d) {
  const w = d.wave;
  if (!w || !w.days || !w.days.length) return '';
  daWaveData = w.days;
  const days = w.days, n = days.length;
  const W = 300, H = 156, L = 20, R = 8, T = 10, B = 30;
  const xs = function(i) { return n === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (n - 1); };
  const ys = function(v) { return T + (5 - v) * (H - T - B) / 4; };
  const series = [ { k: 'q2', cls: 'w-q2' }, { k: 'q1', cls: 'w-q1' }, { k: 'q3', cls: 'w-q3' } ]; // 充実度を最前面に
  const r = n <= 31 ? 3.2 : 2;
  let svg = '<svg class="da-wave" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="日ごとの充実度・コンディション・負荷">';
  [1, 2, 3, 4, 5].forEach(function(v) {
    svg += '<line class="w-grid' + (v === 3 ? ' w-mid' : '') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/>'
         + '<text class="w-ax" x="' + (L - 6) + '" y="' + (ys(v) + 3.5) + '" text-anchor="end">' + v + '</text>';
  });
  series.forEach(function(s) {
    const pts = [];
    days.forEach(function(x, i) { if (x[s.k]) pts.push([xs(i), ys(x[s.k])]); });
    if (pts.length > 1) svg += '<polyline class="' + s.cls + '" fill="none" points="' + pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
    pts.forEach(function(p) { svg += '<circle class="' + s.cls + '-pt" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '"/>'; });
  });
  svg += '<line id="da-wave-cur" class="w-cur" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" style="display:none"/>';
  // 日付の目盛り（点の真下に置く）：最初・真ん中・最後
  const ticks = n === 1 ? [0] : (n >= 5 ? [0, Math.floor((n - 1) / 2), n - 1] : [0, n - 1]);
  ticks.forEach(function(i, j) {
    const anchor = n === 1 ? 'middle' : (j === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle'));
    svg += '<line class="w-tick" x1="' + xs(i).toFixed(1) + '" x2="' + xs(i).toFixed(1) + '" y1="' + (H - B + 2) + '" y2="' + (H - B + 6) + '"/>'
         + '<text class="w-date" x="' + (anchor === 'start' ? xs(i) - 4 : anchor === 'end' ? xs(i) + 4 : xs(i)).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="' + anchor + '">' + daEsc(days[i].d) + '</text>';
  });
  const bw = n === 1 ? (W - L - R) : (W - L - R) / (n - 1);
  days.forEach(function(x, i) {
    svg += '<rect class="w-hit" x="' + (xs(i) - bw / 2).toFixed(1) + '" y="0" width="' + bw.toFixed(1) + '" height="' + H + '" onclick="daWaveShow(' + i + ')"/>';
  });
  svg += '</svg>';
  const mid = Math.floor((n - 1) / 2);
  const recN = days.filter(function(x) { return x.q1 || x.q2 || x.q3; }).length;
  return '<div class="da-sec"><div class="da-sec-title">① 調子の波</div>'
    + '<div class="da-box">'
    + '<div class="da-key da-key-btns" style="margin:0 0 4px;">'
    + '<button type="button" aria-pressed="true" onclick="daWaveToggle(this,\'q3\')"><i class="k-line k-q3"></i>充実度</button>'
    + '<button type="button" aria-pressed="true" onclick="daWaveToggle(this,\'q1\')"><i class="k-line k-q1"></i>コンディション</button>'
    + '<button type="button" aria-pressed="true" onclick="daWaveToggle(this,\'q2\')"><i class="k-line k-q2"></i>負荷（5＝きつい）</button></div>'
    + '<div class="da-note" style="margin:0 0 2px;">名前を押すと、その線を消したり出したりできます</div>'
    + svg
    + '<div class="da-wave-info" id="da-wave-info">グラフを押すと、その日の値が出ます</div></div>'
    + (recN === 0 ? '<div class="da-row" style="color:#b45309;">この範囲の日記は、Q1〜Q3（コンディション・負荷・充実度）が未記入のため、点を表示できません</div>' : '')
    + (recN === 1 ? '<div class="da-note">Q1〜Q3が記入された記録が1回分なので、点だけ表示しています（2回分以上で線になります）</div>' : '')
    + (w.capped ? '<div class="da-note">直近90日分を表示しています</div>' : '') + '</div>';
}
// 線の表示・非表示（見たい線だけに絞れる）
function daWaveToggle(btn, k) {
  const svg = btn.closest('.da-box').querySelector('svg.da-wave');
  if (!svg) return;
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  svg.classList.toggle('hide-' + k, !on);
}
function daWaveShow(i) {
  const x = daWaveData && daWaveData[i];
  const info = document.getElementById('da-wave-info');
  if (!x || !info) return;
  info.textContent = (x.q3 || x.q1 || x.q2)
    ? x.d + '　充実度 ' + (x.q3 || '—') + '　コンディション ' + (x.q1 || '—') + '　負荷 ' + (x.q2 || '—')
    : x.d + '　記録なし';
  const svg = info.parentNode.querySelector('svg');
  const cur = document.getElementById('da-wave-cur');
  const hit = svg ? svg.querySelectorAll('.w-hit')[i] : null;
  if (cur && hit) {
    const cx = parseFloat(hit.getAttribute('x')) + parseFloat(hit.getAttribute('width')) / 2;
    cur.setAttribute('x1', cx); cur.setAttribute('x2', cx); cur.style.display = '';
  }
}


// 次の稽古へ：答えは出さず、本人に問いを1つ返す（決めたことは次の剣道日記のQ4で選ぶ）
function daNext(d) {
  if (!d.focus || !d.focus.length) return '';
  return '<div class="da-next"><div class="da-next-k">🧭 次の稽古へ</div>'
    + '<div class="da-next-q">今のテーマ「' + daEsc(daLabel(d.focus[0].label)) + '」は、次の稽古でも続ける？　それとも変える？</div>'
    + '<div class="da-next-s">決めたことを意識して稽古し、次の剣道日記のQ4で選ぼう</div></div>';
}

// ③ 過去の一言：一言を書いた日の直近7日分を新しい順に（期間ボタンに関係なく固定。最初は5件、「もっと見る」で残り）
const DA_NOTES_FIRST = 5;
function daNotes(d) {
  if (d.notes === undefined) return ''; // GAS が v3 より前（過去の一言を返さない）
  let h = '<div class="da-sec"><div class="da-sec-title">③ 過去の一言' + (d.notes.length ? '<span class="da-sec-sub">直近' + d.notes.length + '日分</span>' : '') + '</div>';
  if (!d.notes.length) return h + '<div class="da-row">まだ一言を書いた日はありません。</div></div>';
  h += '<div class="da-notes">' + d.notes.map(function(n, i) {
    const tags = (n.q4 || []).map(function(t) { return '<span class="da-note-tag">' + daEsc(daLabel(t)) + '</span>'; }).join('');
    return '<div class="da-note-item' + (i >= DA_NOTES_FIRST ? ' da-note-more' : '') + '">'
      + '<div class="da-note-head"><span class="da-note-date">' + daEsc(n.d) + '</span>' + tags + '</div>'
      + '<div class="da-note-text">' + daEsc(n.t) + '</div></div>';
  }).join('') + '</div>';
  const rest = d.notes.length - DA_NOTES_FIRST;
  if (rest > 0) h += '<button type="button" class="da-notes-btn" onclick="daNotesToggle(this,' + rest + ')">もっと見る（残り' + rest + '件）</button>';
  return h + '</div>';
}
function daNotesToggle(btn, rest) {
  const box = btn.previousElementSibling;
  const open = box.classList.toggle('show-all');
  btn.textContent = open ? '閉じる' : 'もっと見る（残り' + rest + '件）';
}

// ===== 初期化 =====
document.addEventListener('DOMContentLoaded', function(){
  refreshSensei();
  loadFeed();
  loadAlerts();
});
</script>
